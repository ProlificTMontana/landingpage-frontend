name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.x', '20.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and component tests
        run: npm test -- --watchAll=false --coverage --ci
        env:
          CI: true

      - name: Upload coverage report
        if: always() && matrix.node == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI=true promotes ESLint warnings to errors, so lint problems fail here.
      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 7

  supply-chain:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gating check. `tailwind-custom-forms` — a typosquat of @tailwindcss/forms
      # — shipped an eval(atob(...)) loader that resolved a C2 host over Ethereum
      # RPC and spawned a detached node process during the build. The tree is
      # clean today, so this fails the build if such a payload reappears.
      - name: Scan dependencies for obfuscated loaders
        run: |
          if grep -rlE 'eval\(atob\(|eval\(Buffer\.from\(' \
               --include='*.js' --include='*.cjs' --include='*.mjs' node_modules; then
            echo "::error::Obfuscated eval payload found in a dependency (see paths above)."
            exit 1
          fi
          echo "No obfuscated eval payloads found in node_modules."

      # Informational only: the CRA 5 dependency tree carries pre-existing
      # advisories that cannot be resolved without ejecting or a major upgrade.
      - name: npm audit (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
